<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Starting Whatsgram</title>

    <style>
      :root {
        color-scheme: dark;
        --background: #12181c;
        --text: #f4f7fc;
        --muted: #a3adb4;
        --accent: #2a70e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        color: var(--text);
        background: var(--background);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      main {
        text-align: center;
      }

      .app-icon {
        width: 124px;
        height: 124px;
        margin: 0 auto 22px;
        display: block;
        object-fit: contain;
      }

      h1 {
        margin: 0;
        font-size: 1.65rem;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.035em;
      }

      p {
        margin: 10px 0 24px;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .loader {
        height: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }

      .loader span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.1s ease-in-out infinite;
      }

      .loader span:nth-child(2) {
        animation-delay: 140ms;
      }

      .loader span:nth-child(3) {
        animation-delay: 280ms;
      }

      body.is-offline .loader {
        display: none;
      }

      button {
        padding: 10px 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        background: var(--accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .retry-icon {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      button:disabled .retry-icon {
        animation: spin 900ms linear infinite;
      }

      [hidden] {
        display: none;
      }

      @keyframes pulse {
        0%,
        60%,
        100% {
          opacity: 0.3;
          transform: scale(0.72);
        }

        30% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader span {
          animation: none;
          opacity: 0.7;
        }

        button:disabled .retry-icon {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <main role="status" aria-live="polite">
      <img class="app-icon" src="../../resources/icon.png" alt="" />
      <h1 id="status-title"></h1>
      <p id="status-description"></p>
      <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
      <button id="retry-button" type="button" hidden>
        <svg class="retry-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5" />
          <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5" />
        </svg>
        <span id="retry-label">Try again</span>
      </button>
    </main>

    <script>
      const statusTitle = document.querySelector('#status-title')
      const statusDescription = document.querySelector('#status-description')
      const retryButton = document.querySelector('#retry-button')
      const retryLabel = document.querySelector('#retry-label')

      function updateConnectionStatus(status) {
        if (status === 'offline') {
          document.body.classList.add('is-offline')
          statusTitle.textContent = 'You’re offline'
          statusDescription.textContent =
            'Check your internet connection. We’ll reconnect automatically.'
          retryButton.hidden = false
          retryButton.disabled = false
          retryLabel.textContent = 'Try again'
        }
      }

      retryButton.addEventListener('click', () => {
        retryButton.disabled = true
        retryLabel.textContent = 'Trying again…'
        window.loadingAPI.retry()
      })

      window.loadingAPI.onConnectionStatusChange(updateConnectionStatus)
    </script>
  </body>
</html>
