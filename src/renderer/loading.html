<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Starting Whatsgram</title>

    <style>
      :root {
        color-scheme: dark;
        --background: #12181c;
        --text: #f4f7fc;
        --muted: #a3adb4;
        --accent: #2a70e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        color: var(--text);
        background: var(--background);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      main {
        text-align: center;
      }

      .app-icon {
        width: 124px;
        height: 124px;
        margin: 0 auto 22px;
        display: block;
        object-fit: contain;
      }

      h1 {
        margin: 0;
        font-size: 1.65rem;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.035em;
      }

      p {
        margin: 10px 0 24px;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .loader {
        height: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }

      .loader span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.1s ease-in-out infinite;
      }

      .loader span:nth-child(2) {
        animation-delay: 140ms;
      }

      .loader span:nth-child(3) {
        animation-delay: 280ms;
      }

      @keyframes pulse {
        0%,
        60%,
        100% {
          opacity: 0.3;
          transform: scale(0.72);
        }

        30% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader span {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>

  <body>
    <main role="status" aria-live="polite">
      <img class="app-icon" src="../../resources/icon.png" alt="" />
      <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
    </main>
  </body>
</html>
