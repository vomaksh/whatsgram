<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Offline</title>

    <style>
      :root {
        color-scheme: dark;

        --accent: #2a70e8;
        --accent-hover: #4387f5;
        --bg: #0a1014;
        --card: rgba(18, 25, 29, 0.94);
        --border: rgba(255, 255, 255, 0.09);
        --text: #f4f7fc;
        --muted: #a3adb4;
        --subtle: #78858d;
        --status-bg: rgba(42, 112, 232, 0.12);
        --status-border: rgba(91, 145, 240, 0.25);
        --shadow: 0 32px 80px rgba(0, 0, 0, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #12181c;
        color: var(--text);
      }

      .card {
        position: relative;
        border-radius: 16px;
        width: min(448px, 100%);
        padding: 40px 38px 34px;
        overflow: hidden;
        text-align: center;
      }

      .app-icon {
        width: 124px;
        height: 124px;
        margin: -3px auto 8px;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 18px 22px rgba(1, 61, 166, 0.28));
      }

      .brand {
        margin: 0 0 22px;
        color: var(--subtle);
        font-size: 0.7rem;
        font-weight: 750;
        letter-spacing: 0.18em;
        line-height: 1;
        text-transform: uppercase;
      }

      .status {
        width: fit-content;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 10px;
        border: 1px solid var(--status-border);
        border-radius: 999px;
        color: var(--muted);
        background: var(--status-bg);
        font-size: 0.75rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.85rem, 5vw, 2.2rem);
        line-height: 1.12;
        letter-spacing: -0.045em;
      }

      .description {
        max-width: 34ch;
        margin: 13px auto 26px;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.65;
      }

      .hint {
        margin: 17px 0 0;
        color: var(--subtle);
        font-size: 0.78rem;
        line-height: 1.5;
      }

      button {
        padding: 12px 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        background: var(--accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .retry-icon {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      button.is-loading .retry-icon {
        animation: spin 900ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 32px 24px 28px;
          border-radius: 24px;
        }

        .app-icon {
          width: 108px;
          height: 108px;
        }

        .brand {
          margin-bottom: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }

        button.is-loading .retry-icon {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="card" role="main" aria-labelledby="offline-title">
      <img class="app-icon" src="../../resources/icon.png" alt="" />

      <h1 id="offline-title">You’re offline</h1>

      <p class="description">
        Whatsgram can’t reach the internet right now. Check your connection, then try again.
      </p>

      <button id="retry-button" type="button">
        <svg class="retry-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5" />
          <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5" />
        </svg>
        <span class="button-label">Try again</span>
      </button>
    </main>

    <script>
      const retryButton = document.querySelector('#retry-button')
      const buttonLabel = retryButton.querySelector('.button-label')

      function retryLoad() {
        retryButton.disabled = true
        retryButton.classList.add('is-loading')
        buttonLabel.textContent = 'Connecting…'
        window.electronAPI.retryLoad()
      }

      window.addEventListener('online', retryLoad)
      retryButton.addEventListener('click', retryLoad)
    </script>
  </body>
</html>
