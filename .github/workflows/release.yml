name: Build and release whazzup

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        id: version
        run: |
          VERSION=$(node scripts/bump-version.js)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git tag v${{ steps.version.outputs.version }}
          git push origin HEAD --tags

      - name: Build whazzup
        run: |
          set -o pipefail
          DEBUG=electron-forge:* pnpm make 2>&1 | tee forge-make.log

      - name: Debug build output
        if: always()
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          ls -la
          if [ -f forge-make.log ]; then
            echo "---- Forge log: interesting lines ----"
            grep -Ei "artifact|out/make|making|maker|package|deb|rpm|target|skip|error|warn" forge-make.log || true
            echo "---- Forge log: last 160 lines ----"
            tail -n 160 forge-make.log
          else
            echo "forge-make.log does not exist"
          fi
          echo "---- Workspace artifact search ----"
          find "$GITHUB_WORKSPACE" -maxdepth 8 \( -name out -o -name '*.deb' -o -name '*.rpm' -o -name 'app.asar' \) -print | sort
          echo "---- Runner work artifact search ----"
          find /home/runner/work -maxdepth 8 \( -name out -o -name '*.deb' -o -name '*.rpm' -o -name 'app.asar' \) -print | sort
          if [ -d out ]; then
            find out -maxdepth 5 -type f | sort
          else
            echo "out directory does not exist"
            find . -maxdepth 5 \( -name '*.deb' -o -name '*.rpm' \) -type f | sort
          fi
          test -n "$(find . -maxdepth 5 \( -name '*.deb' -o -name '*.rpm' \) -type f -print -quit)"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/make/**/*.deb
            out/make/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
