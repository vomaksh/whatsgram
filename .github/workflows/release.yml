name: Build and release whazzup

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          standalone: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        id: version
        run: |
          VERSION=$(node scripts/bump-version.mjs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit version
        if: ${{ env.ACT != 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git tag v${{ steps.version.outputs.version }}
          git push origin HEAD --tags

      - name: Build whazzup
        run: |
          set -o pipefail
          DEBUG=electron-forge:* pnpm make 2>&1 | tee forge-make.log
          echo "exit=$?"
          find out -maxdepth 8 -type f -print | sort || true

      - name: Upload to GitHub Release
        if: ${{ env.ACT != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/make/**/*.deb
            out/make/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
